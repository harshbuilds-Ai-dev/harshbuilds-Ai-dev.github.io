<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="A simple To-Do app to organise your daily tasks.">
  <title>To-Do App | Harsh Dhankhar</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .todo-container { max-width: 750px; margin: auto; }
    .todo-panel { padding: 25px; }
    .task-form { display: flex; gap: 10px; }
    .task-input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #34445f;
      border-radius: 10px;
      background: #080d18;
      color: white;
      font: inherit;
    }
    .task-form button, .task-actions button, .filter-btn, .clear-btn {
      cursor: pointer;
      font: inherit;
      border-radius: 9px;
      padding: 9px 12px;
    }
    .task-form button { border: 0; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin: 22px 0;
    }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn, .clear-btn, .task-actions button {
      background: transparent;
      color: #a0aec5;
      border: 1px solid #34445f;
    }
    .filter-btn.active { color: #61e3e6; border-color: #61e3e6; }
    #taskList { padding: 0; list-style: none; }
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      margin-bottom: 9px;
      background: #0b1424;
      border: 1px solid #26354c;
      border-radius: 11px;
    }
    .task-item input { width: 18px; height: 18px; }
    .task-text { flex: 1; overflow-wrap: anywhere; }
    .task-item.done .task-text {
      text-decoration: line-through;
      color: #71809a;
    }
    .task-actions { display: flex; gap: 5px; }
    .task-count, .note { color: #a0aec5; font-size: .85rem; }
    .empty { text-align: center; color: #a0aec5; padding: 25px 5px; }
    @media(max-width:520px) {
      .task-form { flex-direction: column; }
      .task-form button { width: 100%; }
      .task-item { flex-wrap: wrap; }
      .task-actions { margin-left: 28px; }
    }
  </style>
</head>

<body>

<header class="header">
  <nav class="nav container">
    <a class="logo" href="./index.html">HARSH<span>.</span></a>
    <a href="./index.html#projects">← Back to Portfolio</a>
  </nav>
</header>

<main class="section">
  <div class="container todo-container">

    <p class="eyebrow">PLAN YOUR DAY</p>
    <h1>My <span>To-Do List</span></h1>
    <p class="description">Small steps every day lead to big results.</p>

    <div class="card todo-panel">

      <form class="task-form" id="taskForm">
        <input
          class="task-input"
          id="taskInput"
          type="text"
          maxlength="180"
          placeholder="Enter a new task..."
          aria-label="Enter a new task"
          required
        >
        <button type="submit" class="btn primary">+ Add Task</button>
      </form>

      <div class="toolbar">
        <div class="filters">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="done" type="button">Completed</button>
        </div>

        <button class="clear-btn" id="clearCompleted" type="button">
          Clear Completed
        </button>
      </div>

      <p class="task-count" id="taskCount" aria-live="polite"></p>

      <ul id="taskList"></ul>

      <p class="empty" id="emptyMessage">Your task list is empty. Add your first task!</p>

      <p class="note">
        Tasks are saved in this browser on this device using local storage.
      </p>

    </div>
  </div>
</main>

<footer class="footer">
  <a class="logo" href="./index.html">HARSH<span>.</span></a>
  <p>Learning Today, Building Tomorrow 🚀</p>
</footer>

<script>
  const STORAGE_KEY = "harshbuilds_todo_tasks_v1";

  const form = document.getElementById("taskForm");
  const input = document.getElementById("taskInput");
  const list = document.getElementById("taskList");
  const count = document.getElementById("taskCount");
  const emptyMessage = document.getElementById("emptyMessage");

  let currentFilter = "all";
  let tasks = loadTasks();

  function loadTasks() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(saved) ? saved : [];
    } catch {
      return [];
    }
  }

  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function renderTasks() {
    list.replaceChildren();

    const visibleTasks = tasks.filter(task => {
      if (currentFilter === "active") return !task.done;
      if (currentFilter === "done") return task.done;
      return true;
    });

    visibleTasks.forEach(task => {
      const item = document.createElement("li");
      item.className = "task-item" + (task.done ? " done" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.done;
      checkbox.setAttribute("aria-label", "Mark task completed");

      checkbox.addEventListener("change", () => {
        task.done = checkbox.checked;
        saveTasks();
        renderTasks();
      });

      const text = document.createElement("span");
      text.className = "task-text";
      text.textContent = task.text;

      const actions = document.createElement("div");
      actions.className = "task-actions";

      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.textContent = "Edit";

      editButton.addEventListener("click", () => {
        const updated = prompt("Edit your task:", task.text);

        if (updated === null) return;

        const cleanText = updated.trim();

        if (!cleanText) {
          alert("Task cannot be empty.");
          return;
        }

        task.text = cleanText.slice(0, 180);
        saveTasks();
        renderTasks();
      });

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.textContent = "Delete";

      deleteButton.addEventListener("click", () => {
        tasks = tasks.filter(t => t.id !== task.id);
        saveTasks();
        renderTasks();
      });

      actions.append(editButton, deleteButton);
      item.append(checkbox, text, actions);
      list.appendChild(item);
    });

    const activeTasks = tasks.filter(task => !task.done).length;

    count.textContent =
      activeTasks + " active task(s) · " + tasks.length + " total";

    emptyMessage.hidden = visibleTasks.length > 0;

    document.querySelectorAll(".filter-btn").forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.filter === currentFilter
      );
    });
  }

  form.addEventListener("submit", event => {
    event.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    tasks.unshift({
      id: Date.now().toString() + Math.random().toString(16).slice(2),
      text: text.slice(0, 180),
      done: false
    });

    saveTasks();
    input.value = "";
    renderTasks();
    input.focus();
  });

  document.querySelectorAll(".filter-btn").forEach(button => {
    button.addEventListener("click", () => {
      currentFilter = button.dataset.filter;
      renderTasks();
    });
  });

  document.getElementById("clearCompleted").addEventListener("click", () => {
    const completed = tasks.filter(task => task.done).length;

    if (completed === 0) {
      alert("There are no completed tasks.");
      return;
    }

    if (confirm("Delete all completed tasks?")) {
      tasks = tasks.filter(task => !task.done);
      saveTasks();
      renderTasks();
    }
  });

  renderTasks();
</script>

</body>
</html>
